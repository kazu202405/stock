services:
  - type: web
    name: stock-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    # workerは1本固定（app.py のAPSchedulerがプロセス内で起動するため、
    # 複数workerにするとcronが多重実行される）。並行性はスレッドで確保する。
    # --timeout は ANALYZE_TIMEOUT(60秒) を上回る値にする（既定30秒だと分析中に502になる）
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      # Supabase（株アプリ側：銘柄データ・ノート・デモ売買）
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # GIA（キャンパス）側：認証(auth.users)と会員情報(applicants)
      # 未設定だとログイン・新規登録が一切できない（gia_identity.py）
      - key: GIA_SUPABASE_URL
        sync: false
      - key: GIA_SUPABASE_ANON_KEY
        sync: false
      - key: GIA_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 管理者。gia-next の is_admin() と同じアドレスにそろえる
      - key: GIA_ADMIN_EMAILS
        sync: false
      # Database (SQLAlchemy用)
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # App
      - key: APP_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      # EDINET DB（第三者の構造化API。Freeプランは100 requests/day）
      - key: EDINETDB_API_KEY
        sync: false
      - key: EDINETDB_DAILY_LIMIT
        value: "100"
      # 上限直前で止め、手動確認やプロセス再起動分を残す
      - key: EDINETDB_DAILY_RESERVE
        value: "10"
      - key: EDINETDB_CACHE_HOURS
        value: "24"
      # DIFY (オプション)
      - key: DIFY_API_KEY
        sync: false
