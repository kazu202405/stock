<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>新しいパスワードの設定 - Company Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% include '_auth_styles.html' %}
</head>
<body>

    <header class="py-6 px-6">
        <div class="max-w-md mx-auto">
            <a href="/login" class="text-sm font-medium" style="color: var(--lp-text); text-decoration: none; transition: opacity 0.3s;"
               onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">
                <span style="margin-right: 4px;">&larr;</span> ログインに戻る
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6 pb-16">
        <div class="w-full max-w-md">
            <div class="text-center mb-10">
                <div class="accent-line mx-auto mb-6"></div>
                <h1 class="text-2xl font-light tracking-tight mb-2">新しいパスワードの設定</h1>
                <p class="text-sm" style="color: var(--lp-muted);">6文字以上で設定してください</p>
            </div>

            <div id="errorBox" class="flash-error mb-6" style="display:none;"></div>
            <div id="successBox" class="flash-info mb-6" style="display:none;"></div>

            <form id="resetForm" class="space-y-5" style="display:none;">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: var(--lp-text);">新しいパスワード</label>
                    <input type="password" id="password" class="login-input" placeholder="6文字以上" required autofocus>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: var(--lp-text);">新しいパスワード（確認）</label>
                    <input type="password" id="passwordConfirm" class="login-input" placeholder="もう一度入力" required>
                </div>
                <button type="submit" id="submitBtn" class="login-btn">パスワードを設定する</button>
            </form>

            <div id="retryBox" class="text-center mt-8" style="display:none;">
                <a href="/forgot-password" class="login-link text-sm font-medium">
                    再設定メールを送り直す
                </a>
            </div>
        </div>
    </main>

<script>
// Supabase は #access_token=... をURLのフラグメントに付けて戻す。
// フラグメントはサーバーに送られないので、更新はここ（ブラウザ）で行う。
// 使うのは anon キーだけ。サービスロールキーはページに出さない。
(function () {
    var GIA_URL = {{ gia_url | tojson }};
    var ANON_KEY = {{ gia_anon_key | tojson }};

    var errorBox = document.getElementById('errorBox');
    var successBox = document.getElementById('successBox');
    var form = document.getElementById('resetForm');
    var retryBox = document.getElementById('retryBox');
    var submitBtn = document.getElementById('submitBtn');

    function showError(message, offerRetry) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
        if (offerRetry) retryBox.style.display = 'block';
    }

    if (!GIA_URL || !ANON_KEY) {
        showError('再設定機能の設定が完了していません。管理者にご連絡ください。', false);
        return;
    }

    var hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    var accessToken = hash.get('access_token');
    var hashError = hash.get('error_description') || hash.get('error');

    if (hashError) {
        // 期限切れ・使用済みリンクはここに来る
        showError('このリンクは無効か、有効期限が切れています。（' + hashError + '）', true);
        return;
    }

    if (!accessToken) {
        var query = new URLSearchParams(location.search);
        if (query.get('code')) {
            // PKCEフローの受け口はこのページに無い（送信時の verifier が必要）。
            // 送信側を implicit のままにすれば起きないが、原因が分かるようにしておく。
            showError('このリンク形式には対応していません。管理者にご連絡ください。', true);
        } else {
            showError('再設定用の情報が見つかりません。メール内のリンクから開き直してください。', true);
        }
        return;
    }

    // トークンをURLに残さない（履歴・共有・リファラから漏れる）
    history.replaceState(null, '', location.pathname);

    form.style.display = 'block';

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.style.display = 'none';

        var password = document.getElementById('password').value;
        var confirm = document.getElementById('passwordConfirm').value;

        if (password.length < 6) {
            showError('パスワードは6文字以上で入力してください', false);
            return;
        }
        if (password !== confirm) {
            showError('パスワードが一致しません', false);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '設定中...';

        fetch(GIA_URL.replace(/\/$/, '') + '/auth/v1/user', {
            method: 'PUT',
            headers: {
                'apikey': ANON_KEY,
                'Authorization': 'Bearer ' + accessToken,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password: password })
        }).then(function (res) {
            return res.json().then(function (body) { return { ok: res.ok, body: body }; });
        }).then(function (result) {
            if (!result.ok) {
                var msg = (result.body && (result.body.msg || result.body.message ||
                           result.body.error_description)) || '更新に失敗しました';
                submitBtn.disabled = false;
                submitBtn.textContent = 'パスワードを設定する';
                showError(msg, true);
                return;
            }
            form.style.display = 'none';
            retryBox.style.display = 'none';
            successBox.innerHTML = 'パスワードを変更しました。<br>' +
                '新しいパスワードでログインしてください。';
            successBox.style.display = 'block';
            setTimeout(function () { location.href = '/login'; }, 2500);
        }).catch(function (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'パスワードを設定する';
            showError('通信に失敗しました。時間をおいて再度お試しください。', true);
            console.error(err);
        });
    });
})();
</script>

</body>
</html>
